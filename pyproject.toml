[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stormhub"
dynamic = ["version"]
description = "Create catalogs, data, and metadata for hydrologic modeling in the cloud."
readme = "README.md"
maintainers = [
    { name = "Seth Lawler", email = "slawler@dewberry.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastparquet",
    "fiona==1.9.6",
    "geopandas==1.0.1",
    # For supporting export to NetCDF via engine="h5netcdf"
    "h5netcdf",
    "h5py",
    "kerchunk[hdf]>=0.2.10,<0.3; python_version >= '3.11'",
    "matplotlib==3.9.0",
    "pystac==1.10.0",
    "rasterio==1.3.10",
    "requests==2.32.3",
    "shapely==2.0.7",
    # stormhub's group writes not compatible with zarr 3 without xarray 2025.3.1 (stormhub now uses `zarr_format=2`).
    "xarray==2025.3.1",
    "rioxarray==0.18.1",
    # kerchunk 0.2.10 requires fsspec>=2025.2.0, which s3fs tracks.
    "s3fs>=2025.2.0,<2026",
    # Kerchunk 0.2.10 requires Zarr 3. Python 3.10 uses Zarr 2, no Kerchunk.
    "zarr>=3.1.5,<4; python_version >= '3.11'",
    "zarr==2.18.3; python_version < '3.11'",
    "dask==2025.1.0",
    # Kerchunk 0.2.10 requires numcodecs>=0.15.1. Python 3.10 uses a version compatible with Zarr 2.
    "numcodecs>=0.15.1,<1; python_version >= '3.11'",
    "numcodecs==0.13.1; python_version < '3.11'",
    "scipy==1.15.2",
    "dataretrieval==1.0.11",
    "stac-geoparquet==0.7.0",
    "hecdss==0.1.29",
    "zstandard>=0.25,<0.26"
]

[project.optional-dependencies]
dev = ["pre-commit", "ruff", "pytest", "pytest-cov", "pytest-json-report"]
docs = ["sphinx", "numpydoc", "sphinx_rtd_theme", "sphinx_design", "pydata-sphinx-theme", "sphinx-autodoc-typehints", "myst-parser"]

[project.urls]
repository = "https://github.com/dewberry/stormhub"

[project.scripts]
stormhub-server = "stormhub.server.serve:main"

[tool.pytest.ini_options]
pythonpath = "stormhub"
testpaths = "tests"
log_cli = true
log_cli_level = "INFO"

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff]
line-length = 120
exclude = ["catalogs", "workflows"]

[tool.ruff.lint.per-file-ignores]
"stormhub/met/tests/**" = ["D"]
"docs/**" = ["D"]


[tool.setuptools.packages.find]
where = ["."]
include = ["stormhub*"]

[tool.setuptools.dynamic]
version = {attr = "stormhub.__version__"}

[tool.sphinx]
project = "stormhub"
author = "Seth Lawler"
